<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:500px;overflow:hidden}
  .frame{
    position:relative; width:1500px; height:500px; background:#E9E7E2;
    display:flex; align-items:center;
  }
  .tone{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(10,10,10,.55) 2px, transparent 2.3px);
    background-size:12px 12px;
    -webkit-mask-image:linear-gradient(105deg,#000 0%, transparent 62%);
    opacity:.7;
  }
  /* left zone reserved: the X avatar overlaps here */
  .spacer{width:392px; flex:none}

  .center{position:relative; flex:none; width:470px}
  .wordmark{
    font-family:"Archivo Black",Impact,sans-serif; font-size:96px; line-height:.82;
    letter-spacing:-.03em; color:#0A0A0A; text-transform:uppercase;
  }
  .tagline{
    font-family:"Archivo",sans-serif; font-weight:500; font-size:23px; color:#0A0A0A;
    margin-top:26px;
  }
  .tagline b{font-weight:500; border-bottom:3px solid #C41E1E; padding-bottom:2px}
  .ticker{
    font-family:"IBM Plex Mono",monospace; font-size:14px; letter-spacing:.22em;
    color:#55524C; margin-top:22px; text-transform:uppercase;
  }

  .slots{position:relative; display:flex; gap:20px; margin-left:auto; margin-right:76px}
  .slot{
    position:relative; width:132px; height:185px; border:2px dashed #9E9890;
    background:#DAD6CE; display:flex; align-items:flex-start; padding:13px;
  }
  .slot-tone{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(10,10,10,.5) 2px, transparent 2.3px);
    background-size:11px 11px; opacity:.7;
  }
  .slot-id{
    position:relative; font-family:"IBM Plex Mono",monospace; font-size:14px;
    letter-spacing:.1em; color:#3D3A35;
  }
</style></head>
<body>
  <div class="frame">
    <div class="tone"></div>
    <div class="spacer"></div>
    <div class="center">
      <div class="wordmark">Card<br>Vault</div>
      <div class="tagline">Every trade builds the Vault.<br><b>Nobody takes anything out.</b></div>
      <div class="ticker">$VAULT · Solana</div>
    </div>
    <div class="slots">
      <div class="slot"><div class="slot-tone"></div><div class="slot-id">#001</div></div>
      <div class="slot"><div class="slot-tone"></div><div class="slot-id">#002</div></div>
      <div class="slot"><div class="slot-tone"></div><div class="slot-id">#003</div></div>
      <div class="slot"><div class="slot-tone"></div><div class="slot-id">#004</div></div>
    </div>
  </div>
</body></html>
