<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:1000px;overflow:hidden}
  .frame{
    position:relative; width:1000px; height:1000px; background:#0A0A0A;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .tone{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(233,231,226,.30) 2.2px, transparent 2.6px);
    background-size:16px 16px;
    -webkit-mask-image:radial-gradient(circle at 50% 38%, #000 30%, transparent 74%);
  }
  .mark{
    position:relative; font-family:"Archivo Black",Impact,sans-serif;
    font-size:400px; line-height:.78; color:#E9E7E2; letter-spacing:-.03em;
  }
  .rule{position:relative; width:236px; height:20px; background:#C41E1E; margin-top:46px}
</style></head>
<body>
  <div class="frame">
    <div class="tone"></div>
    <div class="mark">CV</div>
    <div class="rule"></div>
  </div>
</body></html>
